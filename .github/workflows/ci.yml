name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" 2>/dev/null || pip install ruff mypy pytest pytest-cov pytest-asyncio httpx pydantic pydantic-settings python-dotenv numpy

      - name: Lint with ruff
        run: ruff check notifai/ tests/ --output-format=github 2>/dev/null || true

      - name: Type check with mypy
        run: mypy notifai/ --ignore-missing-imports 2>/dev/null || true

      - name: Run tests
        run: pytest tests/ -v --cov=notifai --cov-report=xml --cov-report=term

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  eval-mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic pydantic-settings python-dotenv

      - name: Run eval (mock mode)
        run: python -m notifai.eval.runner --mock --category